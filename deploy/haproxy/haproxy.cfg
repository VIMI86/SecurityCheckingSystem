global
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend api_in
    bind *:8000
    default_backend api_pool

backend api_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health hdr host localhost
    http-check expect status 200
    http-response set-header X-Sentinel-Backend %[srv_name]
    server api-1 api:8000 check inter 2s fall 3 rise 2
    server api-2 api-2:8000 check inter 2s fall 3 rise 2
    server api-3 api-3:8000 check inter 2s fall 3 rise 2

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
